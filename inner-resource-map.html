<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>內在資源盤點 | 薩提爾冰山導航儀</title>

<body class="min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-white pb-20">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-amber-500 to-amber-200 flex items-center justify-center text-slate-950 font-bold shadow-lg">
                <i class="fa-solid fa-compass text-lg"></i>
            </div>
            <div>
                <h1 class="text-base font-bold tracking-wide text-slate-100">內在資源盤點</h1>
                <p class="text-xs text-slate-400">薩提爾冰山 × 照亮者導航儀</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="switchTab('stages')" id="nav-stages" class="px-3 py-1.5 text-xs font-medium rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 transition-all">
                <i class="fa-solid fa-map-location-dot mr-1"></i> 旅程關卡
            </button>
            <button onclick="switchTab('journal')" id="nav-journal" class="px-3 py-1.5 text-xs font-medium rounded-full bg-slate-800 text-slate-400 border border-slate-700 transition-all">
                <i class="fa-solid fa-book-open mr-1"></i> 我的覺察
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-md w-full mx-auto px-4 py-5">

        <!-- STAGES VIEW -->
        <div id="view-stages" style="display: block;" class="space-y-6">
            <div class="bg-gradient-to-br from-slate-800/90 to-slate-900/90 border border-slate-700/60 rounded-2xl p-5 shadow-xl relative overflow-hidden">
                <h2 class="text-lg font-bold text-amber-300 mb-2 flex items-center">
                    <i class="fa-solid fa-fire-flame-curved mr-2 text-amber-400"></i> 把力量放對位置
                </h2>
                <p class="text-xs text-slate-300 leading-relaxed mb-4">
                    當我們被防衛或匱乏卡住時，常常是把資源放錯了位置。一層一層推進，解鎖每一層的「照亮者小結」，找回屬於你的正向力量。
                </p>
                <div class="space-y-1.5">
                    <div class="flex justify-between text-xs text-slate-400">
                        <span>旅程點亮進度</span>
                        <span id="progress-text">0 / 4 燈塔點亮</span>
                    </div>
                    <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                        <div id="progress-bar" class="bg-gradient-to-r from-amber-500 to-sky-400 h-full w-0 transition-all duration-500"></div>
                    </div>
                </div>
            </div>

            <div id="stages-container" class="space-y-4"></div>
        </div>

        <!-- CARDS VIEW -->
        <div id="view-cards" style="display: none;" class="space-y-4">
            <div class="flex items-center justify-between mb-2">
                <button onclick="backToStages()" class="text-xs text-slate-400 hover:text-white flex items-center bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i> 返回關卡清單
                </button>
                <span id="stage-badge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30"></span>
            </div>

            <div class="text-center pb-2">
                <h2 id="current-stage-title" class="text-lg font-bold text-slate-100"></h2>
                <p id="current-stage-desc" class="text-xs text-slate-400 mt-0.5"></p>
            </div>

            <div id="card-swiper-container" class="relative w-full min-h-[380px] flex items-center justify-center"></div>

            <div id="card-nav-buttons" class="flex items-center justify-between pt-2">
                <button id="prev-card-btn" onclick="prevCard()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 border border-slate-700 text-xs font-medium disabled:opacity-40">
                    <i class="fa-solid fa-chevron-left mr-1"></i> 上一張
                </button>
                <span id="card-counter" class="text-xs text-slate-400 font-mono">1 / 4</span>
                <button id="next-card-btn" onclick="nextCard()" class="px-4 py-2 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs shadow-lg hover:bg-amber-400 transition-all">
                    下一張 <i class="fa-solid fa-chevron-right ml-1"></i>
                </button>
            </div>

            <div id="illuminator-box" style="display: none;" class="bg-gradient-to-br from-amber-500/10 via-slate-800 to-sky-500/10 border border-amber-500/40 rounded-2xl p-5 shadow-xl space-y-3 mt-4">
                <div class="flex items-center space-x-2 text-amber-400">
                    <i class="fa-solid fa-sun text-xl"></i>
                    <h3 class="font-bold text-sm tracking-wide">照亮者小結（本層燈塔已點亮）</h3>
                </div>
                <p id="illuminator-text" class="text-xs text-slate-200 leading-relaxed italic border-l-2 border-amber-500 pl-3 py-0.5"></p>
                <button onclick="completeStageAndReturn()" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold text-xs rounded-xl shadow-md transition-all">
                    收下這道光，返回關卡地圖 <i class="fa-solid fa-check ml-1"></i>
                </button>
            </div>
        </div>

        <!-- JOURNAL VIEW -->
        <div id="view-journal" style="display: none;" class="space-y-4">
            <div class="bg-slate-800/90 border border-slate-700 rounded-2xl p-4 shadow-xl">

                    <i class="fa-solid fa-feather-pointed mr-2 text-amber-400"></i> 我的覺察筆記
                </h2>
                <p class="text-xs text-slate-400 mb-3">記錄你在探索過程中的體悟、防衛覺察或資源歸位心得。</p>
                <textarea id="journal-input" rows="3" placeholder="寫下你此刻的內在覺察與體悟..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-amber-500 resize-none"></textarea>
                <div class="flex items-center justify-between mt-2">
                    <select id="journal-tag" class="bg-slate-900 border border-slate-700 text-xs text-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-amber-500">
                        <option value="日常照顧">💡 日常照顧</option>
                        <option value="防衛覺察">🛡️ 防衛覺察</option>
                        <option value="冰山渴望">🌊 冰山渴望</option>
                        <option value="資源歸位">🌟 資源歸位</option>
                    </select>
                    <button onclick="saveJournal()" class="px-4 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-lg shadow hover:bg-amber-400 transition-all">
                        保存筆記
                    </button>
                </div>
            </div>
            <div id="journal-list" class="space-y-3"></div>
        </div>

    </main>

    <footer class="py-4 text-center text-[10px] text-slate-500 border-t border-slate-800 mt-auto">
        內在資源盤點 · 薩提爾冰山對話卡牌導航儀 © 2026
    </footer>

            if (tab === 'stages') {
                document.getElementById('view-stages').style.display = 'block';
                document.getElementById('nav-stages').className = "px-3 py-1.5 text-xs font-medium rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 transition-all";
            } else if (tab === 'journal') {
                document.getElementById('view-journal').style.display = 'block';
                document.getElementById('nav-journal').className = "px-3 py-1.5 text-xs font-medium rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 transition-all";
                renderJournal();
            }
        }

        function renderStages() {
            const container = document.getElementById('stages-container');
            container.innerHTML = '';
            stagesData.forEach((stage) => {
                const isCompleted = completedStages.includes(stage.id);
                container.innerHTML += `
                    <div onclick="openStage(${stage.id})" class="bg-slate-800/90 border ${isCompleted ? 'border-amber-500/50 glow-effect' : 'border-slate-700'} rounded-2xl p-4 shadow-lg cursor-pointer hover:border-amber-400/60 transition-all flex items-center justify-between group">
                        <div class="flex items-center space-x-3.5">
                            <div class="w-11 h-11 rounded-xl bg-gradient-to-br ${stage.color} border ${stage.borderColor} flex items-center justify-center ${stage.textColor} text-lg shadow-inner">
                                <i class="fa-solid ${stage.icon}"></i>
                            </div>
                            <div>
                                <div class="flex items-center space-x-2">
                                    <h3 class="font-bold text-sm text-slate-200 group-hover:text-amber-300 transition-colors">${stage.title}</h3>
                                    ${isCompleted ? '<span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full border border-amber-500/30 font-medium"><i class="fa-solid fa-sun mr-1"></i>燈塔已點亮</span>' : ''}
                                </div>
                                <p class="text-xs text-slate-400 mt-0.5">${stage.subtitle} (4張深度卡牌)</p>
                            </div>
                        </div>
                        <div class="text-slate-500 group-hover:text-amber-400 transition-colors pr-1">
                            <i class="fa-solid fa-chevron-right text-sm"></i>
                        </div>
                    </div>
                `;
            });
        }

        function updateProgress() {
            const count = completedStages.length;
            document.getElementById('progress-text').innerText = `${count} / 4 燈塔點亮`;
            document.getElementById('progress-bar').style.width = `${(count / 4) * 100}%`;
        }

        function openStage(stageId) {
            currentStageId = stageId;
            currentCardIndex = 0;
            const stage = stagesData.find(s => s.id === stageId);
            
            document.getElementById('view-stages').style.display = 'none';
            document.getElementById('view-cards').style.display = 'block';
            document.getElementById('view-journal').style.display = 'none';

            document.getElementById('stage-badge').innerText = `關卡 ${stage.id} / 4`;
            document.getElementById('current-stage-title').innerText = stage.title;
            document.getElementById('current-stage-desc').innerText = stage.subtitle;
            
            document.getElementById('illuminator-box').style.display = 'none';
            document.getElementById('card-swiper-container').style.display = 'flex';
            document.getElementById('card-nav-buttons').style.display = 'flex';
            
            renderCurrentCard();
        }

        function backToStages() {
            document.getElementById('view-cards').style.display = 'none';
            document.getElementById('view-stages').style.display = 'block';
            renderStages();
            updateProgress();
        }

        function renderCurrentCard() {
            const stage = stagesData.find(s => s.id === currentStageId);
            const card = stage.cards[currentCardIndex];
            document.getElementById('card-counter').innerText = `${currentCardIndex + 1} / ${stage.cards.length}`;
            document.getElementById('prev-card-btn').disabled = currentCardIndex === 0;

            const nextBtn = document.getElementById('next-card-btn');
            if (currentCardIndex === stage.cards.length - 1) {
                nextBtn.innerHTML = `查看照亮者小結 <i class="fa-solid fa-sun ml-1"></i>`;
            } else {
                nextBtn.innerHTML = `下一張 <i class="fa-solid fa-chevron-right ml-1"></i>`;
            }

            document.getElementById('card-swiper-container').innerHTML = `
                <div class="perspective-1000 w-full h-[380px] cursor-pointer" onclick="flipCard(this)">
                    <div class="transform-style-3d relative w-full h-full transition-transform duration-500 rounded-2xl shadow-2xl" id="card-inner">
                        <div class="backface-hidden absolute inset-0 bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700/80 rounded-2xl p-6 flex flex-col justify-between shadow-xl">
                            <div>
                                <div class="flex items-center justify-between mb-3">
                                    <span class="text-[11px] font-semibold uppercase px-2.5 py-1 rounded-md bg-amber-500/10 text-amber-400 border border-amber-500/25">${card.subtitle}</span>
                                    <span class="text-xs text-slate-500"><i class="fa-solid fa-rotate mr-1"></i>點擊翻牌</span>
                                </div>
                                <h3 class="text-base font-bold text-slate-100 mb-2">${card.title}</h3>
                                <div class="my-4 bg-slate-900/60 border border-slate-700/60 rounded-xl p-4">
                                    <p class="text-xs text-amber-200/90 leading-relaxed font-medium">"${card.question}"</p>
                                </div>
                            </div>
                            <div class="text-center pb-1"><span class="text-[11px] text-slate-400 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">查看背面防衛覺察與資源歸位 ⬇</span></div>
                        </div>
                        <div class="backface-hidden absolute inset-0 rotate-y-180 bg-gradient-to-br from-slate-900 to-slate-800 border border-amber-500/30 rounded-2xl p-6 flex flex-col justify-between shadow-xl overflow-y-auto">
                            <div class="space-y-3">
                                <h4 class="text-xs font-bold text-amber-400 uppercase"><i class="fa-solid fa-shield-halved mr-1.5"></i> 應對姿態覺察</h4>
                                <p class="text-xs text-slate-300 bg-slate-950/50 border border-slate-800 rounded-lg p-2.5">${card.defense}</p>
                                <h4 class="text-xs font-bold text-sky-400 uppercase pt-2"><i class="fa-solid fa-seedling mr-1.5"></i> 資源歸位與渴望</h4>
                                <p class="text-xs text-slate-200 bg-sky-950/20 border border-sky-500/20 rounded-lg p-2.5">${card.resource}</p>
                            </div>
                            <div class="text-center pt-2"><span class="text-[10px] text-slate-400">再點一次翻回正面</span></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function flipCard(element) {
            const ci = element.querySelector('#card-inner');
            ci.style.transform = ci.style.transform === 'rotateY(180deg)' ? 'rotateY(0deg)' : 'rotateY(180deg)';
        }

        function nextCard() {
            const stage = stagesData.find(s => s.id === currentStageId);
            if (currentCardIndex < stage.cards.length - 1) {
                currentCardIndex++;
                renderCurrentCard();
            } else {
                // Hide card and nav buttons, show illuminator box cleanly
                document.getElementById('card-swiper-container').style.display = 'none';
                document.getElementById('card-nav-buttons').style.display = 'none';

                document.getElementById('illuminator-text').innerText = stage.illuminatorText;
                document.getElementById('illuminator-box').style.display = 'block';
            }
        }

        function prevCard() {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                document.getElementById('illuminator-box').style.display = 'none';
                document.getElementById('card-swiper-container').style.display = 'flex';
                document.getElementById('card-nav-buttons').style.display = 'flex';
                renderCurrentCard();
            }
        }

        function completeStageAndReturn() {
            if (!completedStages.includes(currentStageId)) {
                completedStages.push(currentStageId);
                localStorage.setItem('satir_completed_stages', JSON.stringify(completedStages));
            }
            backToStages();
        }

        function saveJournal() {
            const input = document.getElementById('journal-input');
            const tag = document.getElementById('journal-tag').value;
            const text = input.value.trim();
            if (!text) return alert('請寫下一些覺察內容再保存唷！');
            journalNotes.unshift({ id: Date.now(), text, tag, date: new Date().toISOString().split('T')[0] });
            localStorage.setItem('satir_journal_notes', JSON.stringify(journalNotes));
            input.value = '';
            renderJournal();
        }

        function renderJournal() {
            const list = document.getElementById('journal-list');
            list.innerHTML = journalNotes.length === 0 ? '<div class="text-center py-8 text-xs text-slate-500">目前還沒有覺察筆記</div>' : '';
            journalNotes.forEach(n => {
                list.innerHTML += `
                    <div class="bg-slate-800/80 border border-slate-700/80 rounded-xl p-4 shadow space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] px-2 py-0.5 rounded-full border bg-amber-500/20 text-amber-300">${n.tag}</span>
                            <div class="flex items-center space-x-2">
                                <span class="text-[10px] text-slate-500">${n.date}</span>
                                <button onclick="deleteJournal(${n.id})" class="text-slate-500 hover:text-rose-400 text-xs"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>
                        <p class="text-xs text-slate-200">${n.text}</p>
                    </div>
                `;
            });
        }

        function deleteJournal(id) {
            journalNotes = journalNotes.filter(n => n.id !== id);
            localStorage.setItem('satir_journal_notes', JSON.stringify(journalNotes));
            renderJournal();
        }

        window.onload = initApp;
    </script>
</body>
</html>
